version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bigdata_analytics_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    volumes:
      - ./data:/app/data
      - ./ml/models:/app/ml/models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bigdata_analytics_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
